<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img" aria-label="Diffusion policy architecture: training step with noise-prediction target, and the DDIM sampling loop">
<text x="0.0" y="14.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#12202b" text-anchor="start">Training: one gradient step</text>
<rect x="0.0" y="26.0" width="112.0" height="122.0" rx="6" fill="#ffffff" stroke="#3d5568" stroke-width="1.5"/>
<text x="56.0" y="60.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#12202b" text-anchor="middle">Demo chunk a</text>
<text x="56.0" y="75.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">16 × 8 actions</text>
<text x="56.0" y="91.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle"></text>
<text x="56.0" y="106.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">+ 2 past frames</text>
<text x="56.0" y="121.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">and joint state</text>
<rect x="144.0" y="26.0" width="206.0" height="122.0" rx="6" fill="#fbe6da" stroke="#df6327" stroke-width="1.5"/>
<text x="247.0" y="52.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#12202b" text-anchor="middle">Add noise (schedule)</text>
<text x="247.0" y="67.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">t: integer 0 … 99</text>
<text x="247.0" y="83.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">ε ~ N(0, I)</text>
<text x="247.0" y="98.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">x_t = √α_t · a + √(1 − α_t) · ε</text>
<text x="247.0" y="114.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle"></text>
<text x="247.0" y="129.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">cosine schedule, t = 99 is noise</text>
<rect x="382.0" y="26.0" width="200.0" height="122.0" rx="6" fill="#e6ecf1" stroke="#3d5568" stroke-width="1.5"/>
<text x="482.0" y="44.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#12202b" text-anchor="middle">Network (same code)</text>
<text x="482.0" y="59.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#12202b" text-anchor="middle">ResNet18 + spatial softmax</text>
<text x="482.0" y="75.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#12202b" text-anchor="middle">→ 4 observation tokens</text>
<text x="482.0" y="90.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#12202b" text-anchor="middle">+ 1 time token, encoder 2 layers</text>
<text x="482.0" y="106.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#12202b" text-anchor="middle">decoder 4 layers over 16 tokens</text>
<text x="482.0" y="121.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#12202b" text-anchor="middle">Linear 256 → 8</text>
<text x="482.0" y="137.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#df6327" text-anchor="middle">time input: t (integer 0 … 99)</text>
<rect x="614.0" y="26.0" width="146.0" height="122.0" rx="6" fill="#fbe6da" stroke="#df6327" stroke-width="1.5"/>
<text x="687.0" y="60.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#12202b" text-anchor="middle">Network output</text>
<text x="687.0" y="75.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">the noise ε̂</text>
<text x="687.0" y="91.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle"></text>
<text x="687.0" y="106.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">loss = MSE(ε̂, ε)</text>
<text x="687.0" y="122.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">model.py:171</text>
<polyline points="112.0,87.0 138.0,87.0" fill="none" stroke="#55646f" stroke-width="1.7" stroke-linejoin="round"/><polygon points="144.0,87.0 138.0,90.3 138.0,83.7" fill="#55646f"/>
<polyline points="350.0,87.0 376.0,87.0" fill="none" stroke="#55646f" stroke-width="1.7" stroke-linejoin="round"/><polygon points="382.0,87.0 376.0,90.3 376.0,83.7" fill="#55646f"/>
<polyline points="582.0,87.0 608.0,87.0" fill="none" stroke="#55646f" stroke-width="1.7" stroke-linejoin="round"/><polygon points="614.0,87.0 608.0,90.3 608.0,83.7" fill="#55646f"/>
<text x="0.0" y="176.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#12202b" text-anchor="start">Sampling: every 8 environment steps, gives the 16 × 8 chunk</text>
<rect x="0.0" y="210.0" width="112.0" height="90.0" rx="6" fill="#ffffff" stroke="#3d5568" stroke-width="1.5"/>
<text x="56.0" y="236.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#12202b" text-anchor="middle">Start</text>
<text x="56.0" y="251.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">pure noise</text>
<text x="56.0" y="266.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">x ~ N(0, I)</text>
<text x="56.0" y="282.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">16 × 8</text>
<rect x="136" y="190" width="496" height="160" rx="10" fill="none" stroke="#df6327" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="148.0" y="208.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#df6327" text-anchor="start">repeat 10 times,  t = 90, 80, … 0</text>
<rect x="150.0" y="224.0" width="132.0" height="96.0" rx="6" fill="#e6ecf1" stroke="#3d5568" stroke-width="1.5"/>
<text x="216.0" y="252.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#12202b" text-anchor="middle">Network call</text>
<text x="216.0" y="268.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">same code</text>
<text x="216.0" y="284.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">in: x, time, tokens</text>
<text x="216.0" y="300.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#df6327" text-anchor="middle">out: ε̂</text>
<rect x="310.0" y="224.0" width="308.0" height="96.0" rx="6" fill="#fbe6da" stroke="#df6327" stroke-width="1.5"/>
<text x="464.0" y="244.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#12202b" text-anchor="middle">DDIM update (deterministic)</text>
<text x="464.0" y="260.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">x0 = (x − √(1 − α_t) · ε̂) / √α_t</text>
<text x="464.0" y="276.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">x0 is clipped to ±1 at every step</text>
<text x="464.0" y="292.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">x ← √α_prev · x0 + √(1 − α_prev) · ε̂</text>
<text x="464.0" y="308.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">last call: α_prev = 1, so x = x0</text>
<polyline points="282.0,272.0 304.0,272.0" fill="none" stroke="#55646f" stroke-width="1.7" stroke-linejoin="round"/><polygon points="310.0,272.0 304.0,275.3 304.0,268.7" fill="#55646f"/>
<polyline points="464.0,320.0 464.0,338.0 216.0,338.0 216.0,326.0" fill="none" stroke="#df6327" stroke-width="1.7" stroke-linejoin="round"/><polygon points="216.0,320.0 219.3,326.0 212.7,326.0" fill="#df6327"/>
<text x="340.0" y="333.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#55646f" text-anchor="middle">new x goes back in</text>
<rect x="662.0" y="210.0" width="98.0" height="90.0" rx="6" fill="#ffffff" stroke="#3d5568" stroke-width="1.5"/>
<text x="711.0" y="236.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#12202b" text-anchor="middle">Chunk</text>
<text x="711.0" y="251.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">clamp to ±1,</text>
<text x="711.0" y="266.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">gripper → ±1,</text>
<text x="711.0" y="282.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#12202b" text-anchor="middle">run first 8</text>
<polyline points="112.0,255.0 130.0,255.0" fill="none" stroke="#55646f" stroke-width="1.7" stroke-linejoin="round"/><polygon points="136.0,255.0 130.0,258.3 130.0,251.7" fill="#55646f"/>
<polyline points="632.0,255.0 656.0,255.0" fill="none" stroke="#55646f" stroke-width="1.7" stroke-linejoin="round"/><polygon points="662.0,255.0 656.0,258.3 656.0,251.7" fill="#55646f"/>
<rect x="0" y="367" width="14" height="14" rx="3" fill="#e6ecf1" stroke="#3d5568" stroke-width="1.5"/>
<text x="22.0" y="378.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#55646f" text-anchor="start">same code in both models</text>
<rect x="208" y="367" width="14" height="14" rx="3" fill="#fbe6da" stroke="#df6327" stroke-width="1.5"/>
<text x="230.0" y="378.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#55646f" text-anchor="start">differs between diffusion and flow matching</text>
<text x="760.0" y="380.0" font-family="Liberation Sans Narrow, Arial Narrow, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#df6327" text-anchor="end">10 network calls per chunk</text>
</svg>